        {"url": "https://llm.chutes.ai/v1", "name": "Qwen/Qwen3.8-27B-TEE-pareton", "label": "Qwen 3.8"},
        {"url": "https://llm.chutes.ai/v1", "name": "deepseek-ai/DeepSeek-V3.2-TEE", "label": "DeepSeek V3.2", "cost": 2, "maxTokens": 4096},
        {"url": "https://llm.chutes.ai/v1", "name": "moonshotai/Kimi-K2.6-TEE", "label": "Kimi K2.6", "cost": 2, "maxTokens": 4096},
        {"url": "https://llm.chutes.ai/v1", "name": "zai-org/GLM-5.2-TEE", "label": "GLM 5.2", "cost": 5, "maxTokens": 4096},
