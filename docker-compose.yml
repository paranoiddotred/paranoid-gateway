# The PARANOID gateway on a Phala Cloud confidential VM (dstack, Intel TDX). The hash of this file is
# measured into the chip's boot log, and the image is pinned by digest, so the browser can tell exactly
# what runs. Values in ${...} are Phala encrypted environment variables: sealed to this app's key before
# they leave the operator's machine and opened only inside the chip. Only keys sit there: every address a
# question or a search can be sent to is written out below, so it is part of the measured file.
services:
  gateway:
    image: ghcr.io/paranoiddotred/paranoid-gateway@sha256:576e4b7f63539314213e0f26bf10901a185ec8ac997dc678f5450af994d01ce1
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - gateway-data:/data
    environment:
      # The site's code finds its data folder under this name, so the box uses it too.
      RAILWAY_VOLUME_MOUNT_PATH: /data
      PARANOID_SITE_URL: https://paranoid.red
      PARANOID_CORS_ORIGINS: https://paranoid.red,https://www.paranoid.red
      NEXT_PUBLIC_PARANOID_PROGRAM: 9JJqzEoDGkTE8CMLATRw7CqFhcyWVegfhFuEeGfBfVGm
      # Where search questions go is part of the measured file, so anyone can see it.
      PARANOID_SEARCH_URL: https://searxng-production-64dd.up.railway.app
      PARANOID_ZEC: "1"
      PARANOID_MODEL_URL: https://llm.chutes.ai/v1
      PARANOID_MODEL_NAME: deepseek-ai/DeepSeek-V4-Flash-0731-TEE
      PARANOID_EXTRA_MODELS: |
        [
        {"url": "https://llm.chutes.ai/v1", "name": "unsloth/Mistral-Nemo-Instruct-2407-TEE", "label": "Fast"},
