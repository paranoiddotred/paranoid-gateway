        {"url": "https://llm.chutes.ai/v1", "name": "Qwen/Qwen3.5-397B-A17B-TEE", "label": "Qwen 3.5", "cost": 2, "maxTokens": 4096, "body": {"chat_template_kwargs": {"enable_thinking": false}}},
